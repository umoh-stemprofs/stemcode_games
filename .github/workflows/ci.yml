name: ci

on:
  push:
    # `master` is this repository's branch. With only `main` listed, no push
    # ran the suite at all, so every green build was local (found 2026-11-25).
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint, types, migrations, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stem_games
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/stem_games
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: api
      # CI-only signing key. Never a real secret: it exists so the app can boot.
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install
        run: pip install -r api/requirements-dev.txt

      - name: Lint
        run: ruff check api

      - name: Types
        run: mypy api/app

      - name: Migrations up and down
        run: |
          python -m app.cli migrate
          python -m app.cli migrate --revision base
          python -m app.cli migrate

      - name: Redis contract tests must actually run
        run: pytest api/tests -m redis -q --strict-markers
        # Fails the build if a redis test is skipped: REDIS_URL is set here,
        # so skipping means the coverage silently disappeared (section 3A).

      - name: Tests
        run: pytest api/tests -q --strict-markers

  web:
    name: web (typecheck, build, generated client is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm --prefix web install --no-audit --no-fund

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Rule parity (offline ports vs server rules)
        run: npm --prefix web run test:parity

      - name: Build
        run: npm --prefix web run build

  e2e:
    name: e2e (two learners, a real browser)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stem_games
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # `dev`, not `test`: the browser needs the seeded demo school, and dev is
      # the configuration with the in-process sweeps and no Redis (D-34).
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/stem_games
      PYTHONPATH: api
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install API
        run: pip install -r api/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web
        run: npm --prefix web install --no-audit --no-fund

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Seed the demo school
        run: |
          python -m app.cli migrate
          python -m app.cli seed

      - name: Start the API and the web server
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          npm --prefix web run dev > web.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null \
               && curl -sf http://localhost:3000/login > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "the stack did not come up"; tail -50 api.log web.log; exit 1

      - name: Smoke suite
        run: npm --prefix web run e2e

      - name: Keep the report when a flow breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Show the server logs on failure
        if: failure()
        run: tail -50 api.log web.log

  client-freshness:
    name: generated API client is not stale
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stem_games
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/stem_games
      PYTHONPATH: api
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r api/requirements-dev.txt
      - run: npm --prefix web install --no-audit --no-fund
      - run: python -m app.cli migrate

      - name: Start the API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          npx --yes wait-on http://127.0.0.1:8000/api/health --timeout 60000
        env:
          PYTHONPATH: api

      - name: Regenerate the client
        run: npm run gen:api
        env:
          PYTHONPATH: api

      - name: Fail if the committed client is behind the schema
        run: git diff --exit-code -- web/lib/api
