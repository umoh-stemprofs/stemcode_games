# Container path (P0-T03a). Used by CI and by anyone who has Docker.
# Local development does NOT need this: see README "Path A" (P0-T03b).

name: stem-games

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stem_games
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    command:
      - sh
      - -c
      - python -m app.cli migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      # staging exercises the D-34 guard: no memory cache outside dev/test.
      APP_ENV: staging
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stem_games
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./api
    command: ["python", "-m", "arq", "app.jobs.worker.WorkerSettings"]
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stem_games
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./web
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  db_data:
