<!DOCTYPE html><html class="h-full bg-surface" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>STEMCODE - Sign in to play</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f9f9ff",
            "surface-card": "#FFFFFF",
            "surface-container": "#e7eeff",
            "surface-container-low": "#f0f3ff",
            "surface-container-high": "#dee8ff",
            "surface-container-highest": "#d8e3fb",
            "surface-container-lowest": "#ffffff",
            "primary": "#0045cc",
            "primary-container": "#0d5bff",
            "on-primary": "#ffffff",
            "on-surface": "#111c2d",
            "on-surface-variant": "#434656",
            "border-subtle": "#E2E8F0",
            "outline": "#737688",
            "outline-variant": "#c3c5d9",
            "tertiary-fixed": "#ffdcc3",
            "on-tertiary-fixed": "#2f1500"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans", "sans-serif"],
            "body": ["Atkinson Hyperlegible Next", "sans-serif"],
            "code": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-full flex flex-col bg-[#F8FAFD] text-on-surface font-body antialiased selection:bg-blue-100 selection:text-primary">
<!-- Desktop Top Navigation Bar -->
<header class="w-full bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 transition-all">
<div class="max-w-7xl mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
<!-- Brand Logo / Identity -->
<a class="flex items-center gap-3.5 group" href="#">
<div class="w-11 h-11 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center p-1.5 shadow-sm group-hover:scale-105 transition-transform">
<img alt="STEM Code Logo" class="w-full h-full object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/ALJJyrD85ugCvemcjSdxbfDo5kcVlDKX2AP9se5GjoYkpisq4lntXUGdV0U7T8shAaz0U3FpajzUTVe1H6z3WltOgqXHlT9KuHxTq1-exh_l9ztN3lm9LiiTvRaovFp3U6jHcEXr5vIKLXePex8ybZdqoGrsfS--xshDCb0YOzKFnD2HMPwuPgjX35k_j9gnicN3l2cI1RiU-HSVrepKBbbqanFNs8PHa1MmQMyD3_4tsHms">
</div>
<div class="flex flex-col">
<span class="font-headline font-extrabold text-xl text-slate-900 tracking-tight flex items-center gap-1">
            STEMCODE<span class="text-[#0d5bff]">.ai</span>
</span>
<span class="text-xs font-semibold uppercase tracking-wider text-slate-400">GAMES PORTAL</span>
</div>
</a>
<!-- Desktop Right Links -->
<div class="flex items-center gap-6">

<div class="h-5 w-px bg-slate-200"></div>
<div class="flex items-center gap-2 text-sm font-medium text-slate-500">
<span class="material-symbols-outlined text-lg text-slate-400">language</span>
<span>English</span>
</div>
</div>
</div>
</header>
<!-- Main Desktop Content Area -->
<main class="flex-1 flex flex-col justify-center items-center py-12 px-6 lg:px-8">
<div class="w-full max-w-[580px] flex flex-col items-center">
<!-- Header / Greeting -->
<div class="text-center mb-8">
<h1 class="font-headline font-extrabold text-4xl sm:text-[42px] leading-tight text-slate-900 tracking-tight">
          Sign in to play <span class="inline-block hover:scale-125 transition-transform duration-300 select-none">🚀</span>
</h1>
<p class="font-body text-lg sm:text-xl text-slate-500 mt-2 font-normal">
          Enter your 2 simple steps to enter your game world.
        </p>
</div>
<!-- Main Login Container Card -->
<div class="w-full bg-white rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/60 border border-slate-100 flex flex-col gap-7">
<form class="flex flex-col gap-6" id="student-login-form" onsubmit="event.preventDefault(); handleSignIn();">
<!-- STEP 1 CARD -->
<div class="bg-surface-container-low/70 rounded-2xl p-5 sm:p-6 border border-blue-50/80 flex flex-col gap-4">
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 font-headline font-bold text-xl sm:text-[22px] text-slate-900" for="student-code-input">
<span class="w-8 h-8 rounded-full bg-[#0d5bff] text-white text-base font-headline font-bold flex items-center justify-center shadow-sm">1</span>
                Student Code
              </label>
</div>
<!-- Code Input Box -->
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 text-2xl pointer-events-none">badge</span>
<input autocapitalize="characters" class="w-full h-16 pl-14 pr-4 bg-white text-slate-900 font-code font-bold text-2xl rounded-xl border border-slate-200 focus:border-[#0d5bff] focus:ring-4 focus:ring-blue-100 outline-none uppercase tracking-widest transition-all placeholder:text-slate-300 shadow-inner" id="student-code-input" inputmode="text" placeholder="A-1001" required="" type="text" value="A-1001">
</div>
<!-- Visual Assistance Pill / Desk Hint -->
<div class="flex items-center gap-2.5 text-sm font-medium text-slate-600 bg-white/90 px-3.5 py-2.5 rounded-xl border border-slate-200/60">
<span class="material-symbols-outlined text-xl text-[#0d5bff]">id_card</span>
<span>Check the badge taped to your desk!</span>
</div>
</div>
<!-- STEP 2 CARD -->
<div class="bg-surface-container-low/70 rounded-2xl p-5 sm:p-6 border border-blue-50/80 flex flex-col gap-4">
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 font-headline font-bold text-xl sm:text-[22px] text-slate-900">
<span class="w-8 h-8 rounded-full bg-[#0d5bff] text-white text-base font-headline font-bold flex items-center justify-center shadow-sm">2</span>
                Secret 4-Digit PIN
              </label>
</div>
<!-- 4 Oversized PIN Inputs for clumsy precision & cognitive ease -->
<div class="grid grid-cols-4 gap-3 sm:gap-4 pt-1">
<input aria-label="PIN digit 1" class="pin-digit h-18 sm:h-20 bg-white text-center font-headline font-extrabold text-3xl sm:text-4xl text-slate-900 rounded-xl border border-slate-200 focus:border-[#0d5bff] focus:ring-4 focus:ring-blue-100 outline-none transition-all shadow-inner" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<input aria-label="PIN digit 2" class="pin-digit h-18 sm:h-20 bg-white text-center font-headline font-extrabold text-3xl sm:text-4xl text-slate-900 rounded-xl border border-slate-200 focus:border-[#0d5bff] focus:ring-4 focus:ring-blue-100 outline-none transition-all shadow-inner" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<input aria-label="PIN digit 3" class="pin-digit h-18 sm:h-20 bg-white text-center font-headline font-extrabold text-3xl sm:text-4xl text-slate-900 rounded-xl border border-slate-200 focus:border-[#0d5bff] focus:ring-4 focus:ring-blue-100 outline-none transition-all shadow-inner" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<input aria-label="PIN digit 4" class="pin-digit h-18 sm:h-20 bg-white text-center font-headline font-extrabold text-3xl sm:text-4xl text-slate-900 rounded-xl border border-slate-200 focus:border-[#0d5bff] focus:ring-4 focus:ring-blue-100 outline-none transition-all shadow-inner" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
</div>
<!-- Bottom helper row: Pin status & Show numbers toggle -->
<div class="flex items-center justify-between pt-1">
<div class="flex items-center gap-2 text-sm font-semibold text-slate-500">
<span class="material-symbols-outlined text-lg text-[#0d5bff]">pin</span>
<span>4 numbers</span>
</div>
<button class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white hover:bg-slate-100 text-slate-700 text-sm font-semibold border border-slate-200 active:scale-95 transition-all shadow-sm cursor-pointer" id="toggle-pin-visibility" type="button">
<span class="material-symbols-outlined text-lg" id="pin-eye-icon">visibility</span>
<span id="pin-eye-label">Show numbers</span>
</button>
</div>
</div>
<!-- GIANT PRIMARY CTA -->
<div class="pt-2">
<button class="w-full h-16 sm:h-[68px] rounded-2xl bg-[#0d5bff] hover:bg-[#0045cc] text-white font-headline font-bold text-xl sm:text-2xl flex items-center justify-center gap-3 shadow-lg shadow-blue-500/25 hover:shadow-xl hover:shadow-blue-500/35 hover:-translate-y-0.5 active:translate-y-0 active:shadow-md transition-all cursor-pointer" id="submit-btn" type="submit">
<span>Let's Play!</span>
<span class="material-symbols-outlined text-2xl sm:text-3xl font-bold">arrow_forward</span>
</button>
</div>
</form>
<!-- Safe Haven / Coach Assistance Banner -->
<button class="w-full flex items-center gap-4 p-4 rounded-2xl bg-[#FFF6EE] border border-amber-200/70 hover:bg-[#FFEEDB] transition-colors text-left group cursor-pointer" id="coach-help-btn" type="button">
<div class="w-12 h-12 rounded-xl bg-[#ffdcc3] text-[#804300] flex items-center justify-center flex-shrink-0 group-hover:scale-105 transition-transform shadow-xs">
<span class="material-symbols-outlined text-2xl">support_agent</span>
</div>
<div class="flex-1">
<span class="block font-headline font-bold text-base sm:text-lg text-slate-900 group-hover:text-amber-900 transition-colors">
              Stuck? Ask Coach for Help
            </span>
<span class="block font-body text-sm sm:text-base text-slate-600">
              A teacher will come tap your code
            </span>
</div>

</button>
</div>
<!-- Subtle Desktop Footer -->

</div>
</main>
<script>
    // Pin Box Auto-Advance Logic
    const pinInputs = Array.from(document.querySelectorAll('.pin-digit'));
    pinInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val && index < pinInputs.length - 1) {
          pinInputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          pinInputs[index - 1].focus();
        }
      });
    });

    // Show / Hide PIN Toggle
    const toggleBtn = document.getElementById('toggle-pin-visibility');
    const eyeIcon = document.getElementById('pin-eye-icon');
    const eyeLabel = document.getElementById('pin-eye-label');
    let pinVisible = false;

    toggleBtn.addEventListener('click', () => {
      pinVisible = !pinVisible;
      pinInputs.forEach(i => {
        i.type = pinVisible ? 'text' : 'password';
      });
      eyeIcon.textContent = pinVisible ? 'visibility_off' : 'visibility';
      eyeLabel.textContent = pinVisible ? 'Hide numbers' : 'Show numbers';
    });

    // Coach Help Alert
    document.getElementById('coach-help-btn').addEventListener('click', () => {
      alert("A teacher has been notified and is coming to assist you!");
    });

    // Sign In Action Simulation
    function handleSignIn() {
      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-2xl">sync</span><span>Launching Game...</span>';
      btn.disabled = true;

      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined text-2xl">check_circle</span><span>You are In!</span>';
      }, 1200);
    }
  </script>


</body></html>
