<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafd" />
    <title>No internet · STEM Games</title>
    <!--
      A plain file in /public on purpose: the service worker must be able to
      cache this page before anyone signs in, and a signed-in route would be
      redirected to the sign-in screen. No scripts, no fonts, no network.
    -->
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafd;
        color: #111c2d;
        font-family: system-ui, "Segoe UI", sans-serif;
        font-size: 20px;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1.5px solid #0f172a;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 8px 0 rgba(15, 23, 42, 0.06);
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        display: block;
        margin: 0 auto 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 24px;
        color: #434656;
      }
      p.small {
        margin: 20px 0 0;
        font-size: 16px;
      }
      a {
        display: block;
        min-height: 56px;
        padding: 14px 24px;
        border-radius: 16px;
        background: #0d5bff;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
        font-size: 20px;
      }
      a:active {
        background: #0045cc;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1220;
          color: #f8fafd;
        }
        main {
          background: #111c2d;
          border-color: #334155;
        }
        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>No internet right now.</h1>
      <p>Check your connection, then try again.</p>
      <a href="/">Try again</a>
      <p class="small">Your words are saved on this device.</p>
    </main>
  </body>
</html>
